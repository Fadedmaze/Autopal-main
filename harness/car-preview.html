<!doctype html>
<!-- Dev-only: every 3D body style at a fixed angle, for checking the car model. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Car Preview</title>
<style>
  body { margin: 0; font: 14px Inter, system-ui, sans-serif; background: #f6f7f9; color: #121826; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px; }
  figure { margin: 0; background: radial-gradient(circle at 50% 60%, #e8f0fe, #dfe5ee); border-radius: 18px; }
  .host { position: relative; aspect-ratio: 1; }
  figcaption { padding: 6px 12px 10px; font-weight: 700; }
  .car-3d { position: absolute; inset: 0; width: 100%; height: 100%; }
</style></head>
<body><div class="grid" id="grid"></div>
<script type="module">
  import { mountCar3D } from "../js/car3d.js";
  const params = new URLSearchParams(location.search);
  const angle = Number(params.get("angle") ?? 0.6);
  const cars = [
    ["Sedan", { make: "Civic" }, "#165ac0"], ["Hatchback", { make: "Golf" }, "#be185d"], ["Coupe", { make: "Mustang" }, "#c2410c"],
    ["SUV", { make: "RAV4" }, "#15803d"], ["Truck", { make: "F-150" }, "#4b5565"], ["Van", { make: "Odyssey" }, "#7e22ce"],
  ];
  const only = params.get("only");
  if (only) document.getElementById("grid").style.gridTemplateColumns = "1fr";
  for (const [name, v, color] of cars.filter(([n]) => !only || n.toLowerCase() === only)) {
    const fig = document.createElement("figure");
    fig.innerHTML = `<div class="host"></div><figcaption>${name}</figcaption>`;
    document.getElementById("grid").append(fig);
    mountCar3D(fig.querySelector(".host"), v, color, { spin: false, angle });
  }
</script></body></html>
